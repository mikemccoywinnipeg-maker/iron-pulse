arly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.","Drive through the heel of your lead foot and extend both knees to raise yourself back up.","Step forward with your rear foot, repeating the lunge on the opposite leg."]},"Split_Squat_with_Dumbbells":{"n":"Split Squat with Dumbbells","m":["quadriceps","glutes","hamstrings"],"p":1,"s":["Position yourself into a staggered stance with the rear foot elevated and front foot forward.","Hold a dumbbell in each hand, letting them hang at the sides. This will be your starting position.","Begin by descending, flexing your knee and hip to lower your body down. Maintain good posture througout the movement. Keep the front knee in line with the foot as you perform the exercise.","At the bottom of the movement, drive through the heel to extend the knee and hip to return to the starting position."]},"Good_Morning":{"n":"Good Morning","m":["hamstrings","abdominals","glutes","lower back"],"p":1,"s":["Begin with a bar on a rack at shoulder height. Rack the bar across the rear of your shoulders as you would a power squat, not on top of your shoulders. Keep your back tight, shoulder blades pinched together, and your knees slightly bent. Step back from the rack.","Begin by bending at the hips, moving them back as you bend over to near parallel. Keep your back arched and your cervical spine in proper alignment.","Reverse the motion by extending through the hips with your glutes and hamstrings. Continue until you have returned to the starting position."]},"Pullups":{"n":"Pullups","m":["lats","biceps","middle back"],"p":1,"s":["Grab the pull-up bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","Pull your torso up until the bar touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."]},"Bent_Over_Barbell_Row":{"n":"Bent Over Barbell Row","m":["middle back","biceps","lats","shoulders"],"p":1,"s":["Holding a barbell with a pronated grip (palms facing down), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","Now, while keeping the torso stationary, breathe out and lift the barbell to you. Keep the elbows close to the body and only use the forearms to hold the weight. At the top contracted position, squeeze the back muscles and hold for a brief pause.","Then inhale and slowly lower the barbell back to the starting position.","Repeat for the recommended amount of repetitions."]},"Dumbbell_Rear_Lunge":{"n":"Dumbbell Rear Lunge","m":["quadriceps","calves","glutes","hamstrings"],"p":1,"s":["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.","Step backward with your right leg around two feet or so from the left foot and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Tip: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground. Keep the torso upright during the lunge; flexible hip flexors are important. A long lunge emphasizes the Gluteus Maximus; a short lunge emphasizes Quadriceps.","Push up and go back to the starting position as you exhale. Tip: Use the ball of your feet to push in order to accentuate the quadriceps. To focus on the glutes, press with your heels.","Now repeat with the opposite leg."]},"Barbell_Hack_Squat":{"n":"Barbell Hack Squat","m":["quadriceps","calves","forearms","hamstrings"],"p":1,"s":["Stand up straight while holding a barbell behind you at arms length and your feet at shoulder width. Tip: A shoulder width grip is best with the palms of your hands facing back. You can use wrist wraps for this exercise for a better grip. This will be your starting position.","While keeping your head and eyes up and back straight, squat until your upper thighs are parallel to the floor. Breathe in as you slowly go down.","Pressing mainly with the heel of the foot and squeezing the thighs, go back up as you breathe out.","Repeat for the recommended amount of repetitions."]},"One-Arm_Dumbbell_Row":{"n":"One-Arm Dumbbell Row","m":["middle back","biceps","lats","shoulders"],"p":1,"s":["Choose a flat bench and place a dumbbell on each side of it.","Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.","Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.","Pull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.","Lower the resistance straight down to the starting position. Breathe in as you perform this step.","Repeat the movement for the specified amount of repetitions.","Switch sides and repeat again with the other arm."]},"Barbell_Lunge":{"n":"Barbell Lunge","m":["quadriceps","calves","glutes","hamstrings"],"p":1,"s":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and step forward with your right leg and squat down through your hips, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: Do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. li>","Using mainly the heel of your foot, push up and go back to the starting position as you exhale.","Repeat the movement for the recommended amount of repetitions and then perform with the left leg."]},"Smith_Machine_Upright_Row":{"n":"Smith Machine Upright Row","m":["traps","biceps","middle back","shoulders"],"p":1,"s":["To begin, set the bar on the smith machine to a height that is around the middle of your thighs. Once the correct height is chosen and the bar is loaded, grasp the bar using a pronated (palms forward) grip that is shoulder width apart. You may need some wrist wraps if using a significant amount of weight.","Lift the barbell up and fully extend your arms with your back straight. There should be a slight bend at the elbows. This is the starting position.","Use your side shoulders to lift the bar as you exhale. The bar should be close to the body as you move it up. Continue to lift it until it nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the bar, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]},"Dumbbell_Shrug":{"n":"Dumbbell Shrug","m":["traps"],"p":1,"s":["Stand erect with a dumbbell on each hand (palms facing your torso), arms extended on the sides.","Lift the dumbbells by elevating the shoulders as high as possible while you exhale. Hold the contraction at the top for a second. Tip: The arms should remain extended at all times. Refrain from using the biceps to help lift the dumbbells. Only the shoulders should be moving up and down.","Lower the dumbbells back to the original position.","Repeat for the recommended amount of repetitions."]},"Barbell_Deadlift":{"n":"Barbell Deadlift","m":["lower back","calves","forearms","glutes","hamstrings","lats","middle back","quadriceps","traps"],"p":1,"s":["Stand in front of a loaded barbell.","While keeping the back as straight as possible, bend your knees, bend forward and grasp the bar using a medium (shoulder width) overhand grip. This will be the starting position of the exercise. Tip: If it is difficult to hold on to the bar with this grip, alternate your grip or use wrist straps.","While holding the bar, start the lift by pushing with your legs while simultaneously getting your torso to the upright position as you breathe out. In the upright position, stick your chest out and contract the back by bringing the shoulder blades back. Think of how the soldiers in the military look when they are in standing in attention.","Go back to the starting position by bending at the knees while simultaneously leaning the torso forward at the waist while keeping the back straight. When the weights on the bar touch the floor you are back at the starting position and ready to perform another repetition.","Perform the amount of repetitions prescribed in the program."]}};

// ─── Photo loading + offline cache ──────────────────────────
// Photos are fetched once from the CDN (pinned to one dataset commit), then
// kept in their own IndexedDB database so they work offline. Workout data
// lives in IronPulseDB and is never touched by this code.
const PHOTO_SOURCES = [
  `https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@${PHOTO_SHA}/exercises/`,
  `https://raw.githubusercontent.com/yuhonas/free-exercise-db/${PHOTO_SHA}/exercises/`,
];
const photoMemo = {};     // path -> object URL (this session)
const photoPending = {};  // path -> Promise<url|null>

function openPhotoDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("IronPulsePhotos", 1);
    req.onupgradeneeded = (e) => { const db = e.target.result; if (!db.objectStoreNames.contains("photos")) db.createObjectStore("photos"); };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}
async function photoDbGet(path) {
  try {
    const db = await openPhotoDB();
    return await new Promise((resolve) => { const r = db.transaction("photos", "readonly").objectStore("photos").get(path); r.onsuccess = () => resolve(r.result || null); r.onerror = () => resolve(null); });
  } catch { return null; }
}
async function photoDbPut(path, blob) {
  try {
    const db = await openPhotoDB();
    await new Promise((resolve) => { const tx = db.transaction("photos", "readwrite"); tx.objectStore("photos").put(blob, path); tx.oncomplete = resolve; tx.onerror = resolve; });
  } catch {}
}
async function photoDbCount() {
  try {
    const db = await openPhotoDB();
    return await new Promise((resolve) => { const r = db.transaction("photos", "readonly").objectStore("photos").count(); r.onsuccess = () => resolve(r.result || 0); r.onerror = () => resolve(0); });
  } catch { return 0; }
}
async function fetchPhotoBlob(path) {
  for (const base of PHOTO_SOURCES) {
    try { const res = await fetch(base + path); if (res.ok) { const b = await res.blob(); if (b.size > 0) return b; } } catch {}
  }
  return null;
}
function loadPhoto(path) {
  if (photoMemo[path]) return Promise.resolve(photoMemo[path]);
  if (photoPending[path]) return photoPending[path];
  photoPending[path] = (async () => {
    let blob = await photoDbGet(path);
    if (!blob) { blob = await fetchPhotoBlob(path); if (blob) await photoDbPut(path, blob); }
    delete photoPending[path];
    if (!blob) return null;
    photoMemo[path] = URL.createObjectURL(blob);
    return photoMemo[path];
  })();
  return photoPending[path];
}
function usePhoto(path) {
  const [src, setSrc] = useState(path ? photoMemo[path] || null : null);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    if (!path) return; let live = true;
    if (photoMemo[path]) { setSrc(photoMemo[path]); return; }
    setSrc(null); setFailed(false);
    loadPhoto(path).then(u => { if (!live) return; if (u) setSrc(u); else setFailed(true); });
    return () => { live = false; };
  }, [path]);
  return { src, failed };
}
function getPhotoEntry(name) {
  const id = PHOTO_MAP[name]; if (!id) return null;
  const info = PHOTO_INFO[id]; if (!info) return null;
  return { id, ...info, paths: [`${id}/0.jpg`, `${id}/1.jpg`] };
}
const ALL_PHOTO_PATHS = Object.keys(PHOTO_INFO).flatMap(id => [`${id}/0.jpg`, `${id}/1.jpg`]);
const prefersReducedMotion = () => { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch { return false; } };

// Downloads every exercise photo into the offline cache.
function OfflinePhotosBar() {
  const total = ALL_PHOTO_PATHS.length;
  const [saved, setSaved] = useState(null);
  const [busy, setBusy] = useState(false);
  const [failedCount, setFailedCount] = useState(0);
  useEffect(() => { photoDbCount().then(setSaved); }, []);
  const saveAll = async () => {
    setBusy(true); setFailedCount(0); let fails = 0; let i = 0;
    const queue = [...ALL_PHOTO_PATHS];
    const worker = async () => { while (queue.length) { const p = queue.shift(); const u = await loadPhoto(p); if (!u) fails++; i++; if (i % 4 === 0) setSaved(await photoDbCount()); } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    setSaved(await photoDbCount()); setFailedCount(fails); setBusy(false);
  };
  if (saved === null) return null;
  const done = saved >= total;
  const pct = Math.min(100, Math.round((saved / total) * 100));
  return (
    <div style={{ ...cardStyle, borderRadius: 16, display: "flex", alignItems: "center", gap: 12, padding: "12px 14px" }}>
      <div style={{ width: 36, height: 36, borderRadius: 999, background: done ? "#E7F4EE" : T.fillSoft, color: done ? T.good : T.ink, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><Icon name={done ? "check" : "download"} size={18} sw={2} /></div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 14, fontWeight: 600, color: done ? T.good : T.ink }}>{done ? "Photos saved for offline use" : busy ? `Saving photos… ${pct}%` : "Save photos for offline use"}</div>
        <div style={{ fontSize: 12, color: T.muted, marginTop: 2 }}>{failedCount > 0 ? `${failedCount} photos didn't download. Check your connection and try again.` : `${Math.min(saved, total)} of ${total} on this phone · ~14 MB`}</div>
        {busy && <div style={{ height: 4, borderRadius: 999, background: T.fill, marginTop: 8, overflow: "hidden" }}><div style={{ width: `${pct}%`, height: "100%", background: T.ink, transition: "width 0.3s" }} /></div>}
      </div>
      {!done && <button className="ip-press" onClick={saveAll} disabled={busy} style={{ height: 36, padding: "0 14px", border: "none", borderRadius: 999, cursor: busy ? "default" : "pointer", fontSize: 13, fontWeight: 600, background: busy ? T.fill : T.ink, color: busy ? T.muted : "#FFFFFF", whiteSpace: "nowrap" }}>{busy ? "Saving…" : failedCount ? "Try again" : "Save all"}</button>}
    </div>
  );
}

// ─── Goal ring ──────────────────────────────────────────────
function GoalRing({ current, target, label, color }) {
  const size = 72, sw = 7, r = (size - sw) / 2, circ = 2 * Math.PI * r;
  const met = current >= target; const pct = Math.min(current / target, 1);
  const left = Math.max(target - current, 0);
  return (
    <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label={`${label}: ${current} of ${target}`} style={{ flexShrink: 0 }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={T.lineSoft} strokeWidth={sw} />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={met ? T.good : color} strokeWidth={sw} strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)} transform={`rotate(-90 ${size/2} ${size/2})`} style={{ transition: "stroke-dashoffset 0.5s ease" }} />
        <text x={size/2} y={size/2 + 5} textAnchor="middle" fontFamily="Geist, sans-serif" fontSize="15" fontWeight="700" fill={T.ink}>{current}/{target}</text>
      </svg>
      <div style={{ minWidth: 0 }}>
        <div style={{ fontSize: 15, fontWeight: 600 }}>{label}</div>
        <div style={{ fontSize: 13, color: met ? T.good : T.muted, fontWeight: met ? 600 : 400, marginTop: 2 }}>{met ? "Goal met" : `${left} to go`}</div>
      </div>
    </div>
  );
}

function useElapsed(startTime) {
  const [elapsed, setElapsed] = useState(0);
  useEffect(() => { if (!startTime) { setElapsed(0); return; } setElapsed(Math.floor((Date.now() - startTime) / 1000)); const iv = setInterval(() => setElapsed(Math.floor((Date.now() - startTime) / 1000)), 1000); return () => clearInterval(iv); }, [startTime]);
  return elapsed;
}

  const weekCardio = data.cardioSessions.filter(c => c.date >= week.start && c.date <= week.end);
  const liftDays = new Set(weekWorkouts.map(w => w.date)).size;

  const totalCardioMin = weekCardio.reduce((acc, c) => acc + (c.duration || 0), 0);
  let streak = 0; let checkDate = new Date();
  while (true) {
    const ds = checkDate.toISOString().split("T")[0];
    if (data.workouts.some(w => w.date === ds) || data.cardioSessions.some(c => c.date === ds)) { streak++; checkDate.setDate(checkDate.getDate() - 1); } else break;
  }
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(week.start + "T12:00:00"); d.setDate(d.getDate() + i); const ds = d.toISOString().split("T")[0]; return { ds, letter: "MTWTFSS"[i], lift: weekWorkouts.some(w => w.date === ds), cardio: weekCardio.some(c => c.date === ds), isToday: ds === today, future: ds > today }; });

          <GoalRing current={liftDays} target={GOALS.liftsPerWeek} label="Lifts" color={T.ink} />
          <GoalRing current={cardioDays} target={GOALS.cardioPerWeek} label="Cardio" color="#B45309" />

    </div>
  );
}

  const handleSetComplete = () => { for (let i = 0; i < exercises.length; i++) { const completed = completedSetsMap[i] || 0; if (completed < exercises[i].sets.length) { setCompletedSetsMap({ ...completedSetsMap, [i]: completed + 1 }); return; } } };
  const handleFinish = async () => { if (exercises.length === 0) return; const duration = startTime ? Math.floor((Date.now() - startTime) / 1000) : 0; const workout = { id: Date.now(), date: getToday(), type: workoutType, duration, exercises: exercises.map(e => ({ name: e.name, equipment: e.equipment, primary: e.primary, sets: e.sets.filter(s => s.reps > 0) })) }; const newData = { ...data, workouts: [...data.workouts, workout] }; setData(newData); await saveToStorage(newData); setSaved(true); setWorkoutStatus("idle"); setStartTime(null); setCompletedSetsMap({}); setTimeout(() => { setExercises([]); setSaved(false); }, 1500); };

          <div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 6 }}><span style={{ fontWeight: 600 }}>{totalCompleted} of {totalSets} sets</span><span style={{ color: T.muted }}>{currentEx >= 0 ? `Exercise ${currentEx + 1} of ${exercises.length}` : "All sets done"}</span></div>
            <div role="progressbar" aria-valuemin={0} aria-valuemax={totalSets} aria-valuenow={totalCompleted} style={{ height: 6, borderRadius: 999, background: T.fill, overflow: "hidden" }}><div style={{ width: `${pct}%`, height: "100%", background: typeColor, borderRadius: 999, transition: "width 0.3s" }} /></div>
          </div>
        </div>
      ) : (
        <>
          <h1 style={pageTitle}>Lift</h1>
          <WorkoutTypeSelector selected={workoutType} onSelect={(t) => workoutStatus === "idle" && setWorkoutType(t)} suggestedType={suggested} />
          {workoutType && (
            <div style={{ display: "flex", gap: 8 }}>
              <button className="ip-press" onClick={() => setShowTemplates(true)} style={{ flex: 1, height: 46, borderRadius: 14, border: `1px solid ${T.line}`, background: T.card, color: T.ink, cursor: "pointer", fontSize: 14, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}><Icon name="template" size={18} />Templates{(templates[workoutType]?.length || 0) > 0 ? ` (${templates[workoutType].length})` : ""}</button>
              {exercises.length > 0 && <button className="ip-press" onClick={() => setShowSaveTemplate(true)} style={{ flex: 1, height: 46, borderRadius: 14, border: `1px solid ${T.line}`, background: T.card, color: T.ink, cursor: "pointer", fontSize: 14, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}><Icon name="save" size={18} />Save as template</button>}
            </div>
          )}
        </>
      )}

      {showTemplates && (
        <Sheet onClose={() => setShowTemplates(false)} label={`${EXERCISE_DB[workoutType]?.label} templates`} center maxWidth={440}>
          <div style={{ padding: 20 }}>
            <SheetHeader title={`${EXERCISE_DB[workoutType]?.label} templates`} onClose={() => setShowTemplates(false)} accent={typeColor} />
            {(templates[workoutType]?.length || 0) === 0 ? (
              <EmptyState>No templates saved yet. Build a workout and tap "Save as template".</EmptyState>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                {templates[workoutType].map(t => (
                  <div key={t.id} style={{ ...cardStyle, padding: 16 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, marginBottom: 10 }}>
                      <div>
                        <div style={{ fontSize: 17, fontWeight: 700 }}>{t.name}</div>
                        <div style={{ fontSize: 13, color: T.muted, marginTop: 2 }}>{t.exercises.length} exercises · {t.exercises.reduce((a, e) => a + e.sets.length, 0)} sets</div>
                      </div>
                      <button onClick={() => deleteTemplate(t.id)} aria-label={`Delete template ${t.name}`} style={{ width: 40, height: 40, flexShrink: 0, border: "none", borderRadius: 999, background: "transparent", color: T.danger, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}><Icon name="trash" size={18} /></button>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 12 }}>
                      {t.exercises.map((ex, j) => (
                        <div key={j} style={{ display: "flex", gap: 10, alignItems: "center" }}>
                          <ExerciseThumb exercise={ex} size={34} color={typeColor} />
                          <span style={{ fontSize: 14, color: T.ink }}>{ex.name} <span style={{ color: T.muted }}>· {ex.sets.length} sets{ex.sets[0]?.weight ? ` · ${ex.sets[0].weight} lb` : ""}</span></span>
                        </div>
                      ))}
                    </div>
                    <button className="ip-press" onClick={() => loadTemplate(t)} style={{ ...btnPrimary, height: 48, fontSize: 15 }}>Load template</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </Sheet>
      )}

      {showSaveTemplate && (
        <Sheet onClose={() => setShowSaveTemplate(false)} label="Save template" center maxWidth={400}>
          <div style={{ padding: 20 }}>
            <SheetHeader title="Save template" onClose={() => setShowSaveTemplate(false)} />
            <div style={{ fontSize: 14, color: T.muted, marginBottom: 12 }}>{exercises.length} exercises · {exercises.reduce((a, e) => a + e.sets.length, 0)} sets</div>
            <input className="ip-input" type="text" aria-label="Template name" value={templateName} onChange={e => setTemplateName(e.target.value)} placeholder={`e.g. "Heavy ${EXERCISE_DB[workoutType]?.label} Day"`} style={{ ...fieldStyle, marginBottom: 16 }} />
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={() => setShowSaveTemplate(false)} style={{ ...btnSecondary, flex: 1, height: 50 }}>Cancel</button>
              <button onClick={saveTemplate} disabled={!templateName.trim()} style={{ ...btnPrimary, flex: 1, height: 50, background: templateName.trim() ? T.ink : T.fill, color: templateName.trim() ? "#FFFFFF" : T.muted, cursor: templateName.trim() ? "pointer" : "default" }}>Save</button>
            </div>
          </div>
        </Sheet>
      )}

      {exercises.length === 0 && !saved && <EmptyState>Add exercises or load a template to build your {EXERCISE_DB[workoutType]?.label || ""} workout.</EmptyState>}

      {exercises.map((ex, i) => (
        <ExerciseCard key={i} exercise={ex} typeColor={typeColor} completedSets={completedSetsMap[i] || 0} isCurrent={i === currentEx} active={active} lastSets={lastSetsFor(ex.name)} onAddSet={() => addSet(i)} onUpdateSet={(si, s) => updateSet(i, si, s)} onRemoveSet={(si) => removeSet(i, si)} onRemoveExercise={() => removeExercise(i)} onOpenDetail={setDetail} />
      ))}
      {detail && <ExerciseDetail exercise={detail} color={typeColor} onClose={() => setDetail(null)} />}

      <button className="ip-press" onClick={() => setShowPicker(true)} style={{ width: "100%", height: 52, border: "1.5px dashed #C9C9C2", borderRadius: 16, background: "transparent", color: T.ink, cursor: "pointer", fontSize: 15, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}><Icon name="plus" size={18} sw={2.2} />Add exercise</button>

      {exercises.length > 0 && !saved && workoutStatus === "idle" && (
        <div style={{ position: "sticky", bottom: "calc(76px + env(safe-area-inset-bottom))", zIndex: 20, paddingTop: 4 }}>
          <button className="ip-press" onClick={handleStart} style={{ ...btnPrimary, boxShadow: "0 8px 24px rgba(21,23,26,0.18)" }}><Icon name="play" size={18} color="#FFFFFF" />Start workout</button>
        </div>
      )}

      {exercises.length > 0 && !saved && active && (
        <div style={{ position: "sticky", bottom: "calc(76px + env(safe-area-inset-bottom))", zIndex: 20, display: "flex", gap: 10, padding: 10, margin: "0 -10px", background: "rgba(246,246,243,0.94)", backdropFilter: "blur(10px)", WebkitBackdropFilter: "blur(10px)", borderRadius: 22 }}>
          <button className="ip-press" onClick={handleFinish} style={btnSecondary}>Finish</button>
          <button className="ip-press" onClick={handleSetComplete} disabled={currentEx < 0} style={{ ...btnPrimary, flex: 1, background: currentEx < 0 ? T.fill : T.ink, color: currentEx < 0 ? T.muted : "#FFFFFF", cursor: currentEx < 0 ? "default" : "pointer" }}><Icon name="check" size={20} sw={2.6} />{currentEx >= 0 ? `Complete set ${currentSetNo}` : "All sets done"}</button>
        </div>
      )}

      {saved && <div role="status" style={{ ...btnPrimary, background: T.good, cursor: "default" }}><Icon name="check" size={20} sw={2.6} />Workout saved</div>}

      {showPicker && workoutType && <ExercisePicker type={workoutType} onSelect={addExercise} onClose={() => setShowPicker(false)} />}
    </div>
  );
}

function CardioView({ data, setData }) {
  const [cardioType, setCardioType] = useState("cycling");
  const [duration, setDuration] = useState("");
  const [distance, setDistance] = useState("");
  const [notes, setNotes] = useState("");
  const [saved, setSaved] = useState(false);
  const ct = CARDIO_TYPES.find(t => t.id === cardioType);

  const saveSession = async () => {
    if (!duration) return;
    const session = { id: Date.now(), date: getToday(), type: cardioType, duration: Number(duration), distance: distance ? Number(distance) : null, notes, pace: distance && duration ? (Number(duration) / Number(distance)).toFixed(2) : null };
    const newData = { ...data, cardioSessions: [...data.cardioSessions, session] };
    setData(newData); await saveToStorage(newData);
    setSaved(true); setTimeout(() => { setDuration(""); setDistance(""); setNotes(""); setSaved(false); }, 1500);
  };
  const fieldLabel = { fontSize: 13, fontWeight: 600, color: T.muted, display: "block", marginBottom: 6 };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <h1 style={pageTitle}>Cardio</h1>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))", gap: 8 }}>
        {CARDIO_TYPES.map(t => { const on = cardioType === t.id; return (
          <button key={t.id} className="ip-press" onClick={() => setCardioType(t.id)} aria-pressed={on} style={{ padding: "16px 8px", borderRadius: 16, cursor: "pointer", border: `1.5px solid ${on ? T.ink : T.line}`, background: on ? T.ink : T.card, color: on ? "#FFFFFF" : T.ink, display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
            <Icon name={t.id} size={28} sw={1.8} />
            <span style={{ fontSize: 14, fontWeight: 600 }}>{t.label}</span>
          </button>
        ); })}
      </div>
      <div style={{ ...cardStyle, borderRadius: 20, padding: 18, display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 12 }}>
          <label><span style={fieldLabel}>Duration (min)</span><input className="ip-input" type="number" inputMode="numeric" value={duration} onChange={e => setDuration(e.target.value)} placeholder="0" style={{ ...fieldStyle, height: 56, fontSize: 22, fontWeight: 700 }} /></label>
          <label><span style={fieldLabel}>Distance (mi)</span><input className="ip-input" type="number" inputMode="decimal" step="0.1" value={distance} onChange={e => setDistance(e.target.value)} placeholder="0.0" style={{ ...fieldStyle, height: 56, fontSize: 22, fontWeight: 700 }} /></label>
        </div>
        {distance && duration && (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: "12px 14px", background: T.fillSoft, borderRadius: 12 }}>
            <span style={{ fontSize: 14, color: T.muted }}>Pace</span>
            <span style={{ fontSize: 18, fontWeight: 700 }}>{(Number(duration) / Number(distance)).toFixed(1)} <span style={{ fontSize: 13, fontWeight: 500, color: T.muted }}>min/mi</span></span>
          </div>
        )}
        <label><span style={fieldLabel}>Notes</span><input className="ip-input" type="text" value={notes} onChange={e => setNotes(e.target.value)} placeholder="How did it feel?" style={fieldStyle} /></label>
      </div>
      <button className="ip-press" onClick={saveSession} disabled={!duration} style={{ ...btnPrimary, background: saved ? T.good : duration ? T.ink : T.fill, color: saved || duration ? "#FFFFFF" : T.muted, cursor: duration ? "pointer" : "default" }}>
        {saved ? <><Icon name="check" size={20} sw={2.6} />Session saved</> : <><span aria-hidden="true" style={{ display: "flex" }}><Dot color={duration ? ct?.color : T.hint} /></span>Save {ct?.label.toLowerCase()} session</>}
      </button>
    </div>
  );
}

function HistoryView({ data, setData }) {
  const [filter, setFilter] = useState("all");
  const allEntries = [...data.workouts.map(w => ({ ...w, category: "weights" })), ...data.cardioSessions.map(c => ({ ...c, category: "cardio" }))].sort((a, b) => (b.date > a.date ? 1 : -1));
  const filtered = filter === "all" ? allEntries : filter === "weights" ? allEntries.filter(e => e.category === "weights") : allEntries.filter(e => e.category === "cardio");
  const deleteEntry = async (entry) => {
    let newData;
    if (entry.category === "weights") { newData = { ...data, workouts: data.workouts.filter(w => w.id !== entry.id) }; }
    else { newData = { ...data, cardioSessions: data.cardioSessions.filter(c => c.id !== entry.id) }; }
    setData(newData); await saveToStorage(newData);
  };
  const del = (entry, what) => <button onClick={() => deleteEntry(entry)} aria-label={`Delete ${what} on ${formatDate(entry.date)}`} style={{ width: 40, height: 40, flexShrink: 0, border: "none", borderRadius: 999, background: "transparent", color: T.hint, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", marginTop: -6, marginRight: -8 }}><Icon name="trash" size={18} /></button>;
  const stat = (label, value) => <div><div style={capLabel}>{label}</div><div style={{ fontSize: 18, fontWeight: 700, marginTop: 2 }}>{value}</div></div>;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <h1 style={pageTitle}>History</h1>
      <div style={{ ...segWrap, gridTemplateColumns: "repeat(3, minmax(0, 1fr))" }}>
        {["all", "weights", "cardio"].map(f => <button key={f} onClick={() => setFilter(f)} aria-pressed={filter === f} style={{ ...seg(filter === f), textTransform: "capitalize" }}>{f}</button>)}
      </div>
      {filtered.length === 0 ? (
        <EmptyState>No workouts logged yet.</EmptyState>
      ) : filtered.map((entry, i) => {
        if (entry.category === "weights") {
          const typeColor = EXERCISE_DB[entry.type]?.color;
          const sets = entry.exercises.reduce((a, e) => a + e.sets.length, 0);
          return (
            <div key={i} style={{ ...cardStyle, padding: "16px 18px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 18, fontWeight: 700, letterSpacing: "-0.01em" }}><Dot color={typeColor} />{EXERCISE_DB[entry.type]?.label}</div>
                  <div style={{ fontSize: 13, color: T.muted, marginTop: 3 }}>{formatDate(entry.date)}{entry.duration ? ` · ${formatDuration(Math.round(entry.duration / 60))}` : ""} · {sets} sets</div>
                </div>
                {del(entry, "workout")}
              </div>
              <div style={{ marginTop: 12, paddingTop: 4, borderTop: `1px solid ${T.lineSoft}` }}>
                {entry.exercises.map((ex, j) => (
                  <div key={j} style={{ display: "flex", gap: 12, alignItems: "center", padding: "8px 0", borderBottom: j < entry.exercises.length - 1 ? `1px solid ${T.lineSoft}` : "none" }}>
                    <ExerciseThumb exercise={ex} size={40} color={typeColor} />
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontSize: 14, fontWeight: 600 }}>{ex.name}</div>
                      <div style={{ fontSize: 13, color: T.muted, marginTop: 1 }}>{ex.sets.map((s) => `${s.weight}×${s.reps}`).join(" · ")}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        } else {
          const ct = CARDIO_TYPES.find(t => t.id === entry.type);
          return (
            <div key={i} style={{ ...cardStyle, padding: "16px 18px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 18, fontWeight: 700, letterSpacing: "-0.01em" }}><Dot color={ct?.color} />{ct?.label}</div>
                  <div style={{ fontSize: 13, color: T.muted, marginTop: 3 }}>{formatDate(entry.date)}</div>
                </div>
                {del(entry, ct?.label || "session")}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))", gap: 8, marginTop: 12, paddingTop: 12, borderTop: `1px solid ${T.lineSoft}` }}>
                {stat("Time", formatDuration(entry.duration))}
                {entry.distance ? stat("Distance", `${entry.distance} mi`) : <div />}
                {entry.pace ? stat("Pace", `${Number(entry.pace).toFixed(1)}/mi`) : <div />}
              </div>
              {entry.notes && <div style={{ marginTop: 10, fontSize: 14, color: T.muted, fontStyle: "italic" }}>"{entry.notes}"</div>}
            </div>
          );
        }
      })}
    </div>
  );
}

function LibraryCard({ ex, color, onOpen }) {
  return (
    <button className="ip-row ip-press" onClick={() => onOpen(ex)} style={{ ...cardStyle, borderRadius: 16, overflow: "hidden", padding: 0, cursor: "pointer", textAlign: "left", display: "flex", flexDirection: "column", minWidth: 0 }}>
      <ExerciseThumb exercise={ex} size={128} color={color} radius={0} fill />
      <div style={{ padding: "10px 12px 12px", minWidth: 0, width: "100%" }}>
        <div style={{ fontSize: 14, fontWeight: 600, lineHeight: 1.25, color: T.ink }}>{ex.name}</div>
        <div style={{ fontSize: 12, color: T.muted, marginTop: 2 }}>{equipLabel(ex.equipment)}</div>
      </div>
    </button>
  );
}

function ExerciseLibrary() {
  const [activeGroup, setActiveGroup] = useState("push");
  const [equipFilter, setEquipFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [detail, setDetail] = useState(null);
  const group = EXERCISE_DB[activeGroup];
  const q = search.trim().toLowerCase();
  const exercises = group.exercises.filter(e => equipFilter === "all" || e.equipment === equipFilter).filter(e => !q || e.name.toLowerCase().includes(q) || e.primary.toLowerCase().includes(q));
  const byMuscle = {};
  exercises.forEach(ex => { if (!byMuscle[ex.primary]) byMuscle[ex.primary] = []; byMuscle[ex.primary].push(ex); });
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <h1 style={pageTitle}>Library</h1>
      <OfflinePhotosBar />
      <label style={{ display: "flex", alignItems: "center", gap: 10, height: 48, padding: "0 14px", background: T.card, border: `1px solid ${T.line}`, borderRadius: 14 }}>
        <Icon name="search" size={18} color={T.muted} sw={2} />
        <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Search exercises or muscles" aria-label="Search exercises" style={{ flex: 1, minWidth: 0, border: "none", outline: "none", background: "transparent", fontSize: 16, color: T.ink }} />
      </label>
      <div style={{ ...segWrap, gridTemplateColumns: "repeat(3, minmax(0, 1fr))" }}>
        {Object.entries(EXERCISE_DB).map(([key, val]) => <button key={key} onClick={() => setActiveGroup(key)} aria-pressed={activeGroup === key} style={seg(activeGroup === key)}>{val.label}</button>)}
      </div>
      <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 2 }}>
        {["all", "barbell", "dumbbells", "bodyweight", "cable"].map(f => <button key={f} onClick={() => setEquipFilter(f)} aria-pressed={equipFilter === f} style={pill(equipFilter === f)}>{f === "all" ? "All" : equipLabel(f)}</button>)}
      </div>
      {Object.keys(byMuscle).length === 0 && <EmptyState>No exercises match.</EmptyState>}
      {Object.entries(byMuscle).map(([muscle, exs]) => (
        <div key={muscle} style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 6 }}>
          <SectionTitle right={exs.length}>{muscle}</SectionTitle>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 12 }}>
            {exs.map((ex, i) => <LibraryCard key={i} ex={ex} color={group.color} onOpen={setDetail} />)}
          </div>
        </div>
      ))}
      {detail && <ExerciseDetail exercise={detail} color={group.color} onClose={() => setDetail(null)} />}
    </div>
  );
}

// ─── Main App ───────────────────────────────────────────────
function FitnessTracker() {
  const [tab, setTab] = useState("today");
  const [data, setData] = useState({ workouts: [], cardioSessions: [] });
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      const stored = await loadFromStorage();
      if (stored && (stored.workouts?.length || stored.cardioSessions?.length)) setData(stored);
      setLoaded(true);
    })();
  }, []);

  const getSuggestedType = useCallback(() => {
    const recent = [...data.workouts].sort((a, b) => (b.date > a.date ? 1 : -1));
    if (recent.length === 0) return "push";
    const lastType = recent[0].type;
    return { push: "pull", pull: "legs", legs: "push" }[lastType] || "push";
  }, [data.workouts]);

  const go = (t) => { setTab(t); try { window.scrollTo({ top: 0 }); } catch {} };

  if (!loaded) return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: T.bg, color: T.muted, fontSize: 15, fontWeight: 500 }}>Loading…</div>
  );

  return (
    <div style={{ minHeight: "100vh", minHeight: "100dvh", background: T.bg, color: T.ink }}>
      <main style={{ maxWidth: 560, margin: "0 auto", padding: "calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 112px)" }}>
        {tab === "today" && <TodayView data={data} getSuggestedType={getSuggestedType} onStartLift={() => go("weights")} onLogCardio={() => go("cardio")} />}
        {tab === "weights" && <WeightsView data={data} setData={setData} getSuggestedType={getSuggestedType} />}
        {tab === "cardio" && <CardioView data={data} setData={setData} />}
        {tab === "history" && <HistoryView data={data} setData={setData} />}
        {tab === "exercises" && <ExerciseLibrary />}
      </main>
      <TabBar activeTab={tab} onTabChange={go} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FitnessTracker />);
</script>
</body>
</html>
