// ─── IndexedDB Storage ──────────────────────────────────────
const DB_NAME = "IronPulseDB";
const DB_VERSION = 1;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("data")) db.createObjectStore("data");
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function dbGet(key) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction("data", "readonly");
    const req = tx.objectStore("data").get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}

async function dbSet(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("data", "readwrite");
    tx.objectStore("data").put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function loadFromStorage() {
  try { return await dbGet("fitness-data"); } catch { return null; }
}
async function saveToStorage(data) {
  try { await dbSet("fitness-data", data); } catch (e) { console.error("Save failed:", e); }
}
async function loadTemplates() {
  try { return (await dbGet("fitness-templates")) || { push: [], pull: [], legs: [] }; } catch { return { push: [], pull: [], legs: [] }; }
}
async function saveTemplates(templates) {
  try { await dbSet("fitness-templates", templates); } catch (e) { console.error("Template save failed:", e); }
}

// ─── Goal Progress Ring ─────────────────────────────────────
function GoalRing({ current, target, label, color, size = 80 }) {
  const r = (size - 10) / 2; const circ = 2 * Math.PI * r; const pct = Math.min(current / target, 1); const offset = circ * (1 - pct); const met = current >= target;
  return (
    <div style={{ textAlign: "center" }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={5}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={met ? "#3AE89F" : color} strokeWidth={5} strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" style={{ transition: "stroke-dashoffset 0.5s ease" }}/>
      </svg>
      <div style={{ marginTop: -size+10, height: size-10, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
        <div style={{ fontSize: size*0.3, fontWeight: 900, color: met ? "#3AE89F" : "#fff", fontFamily: "'Bebas Neue', sans-serif" }}>{current}/{target}</div>
      </div>
      <div style={{ fontSize: 10, color: "rgba(255,255,255,0.4)", textTransform: "uppercase", letterSpacing: "0.06em", fontFamily: "'DM Sans', sans-serif", fontWeight: 700, marginTop: 6 }}>{label}</div>
      {met && <div style={{ fontSize: 9, color: "#3AE89F", fontFamily: "'DM Sans', sans-serif", fontWeight: 700, marginTop: 2 }}>GOAL MET ✓</div>}
    </div>
  );
}

function WorkoutTimer({ startTime, color }) {
  const [elapsed, setElapsed] = useState(0);
  useEffect(() => { if (!startTime) return; const iv = setInterval(() => setElapsed(Math.floor((Date.now() - startTime) / 1000)), 1000); return () => clearInterval(iv); }, [startTime]);
  if (!startTime) return null;
  return (
    <div style={{ textAlign: "center", padding: "12px 0", marginBottom: 16, background: `${color}10`, borderRadius: 14, border: `1px solid ${color}30` }}>
      <div style={{ fontSize: 10, color: "rgba(255,255,255,0.4)", textTransform: "uppercase", letterSpacing: "0.1em", fontFamily: "'DM Sans', sans-serif", fontWeight: 700, marginBottom: 4 }}>Workout Timer</div>
      <div style={{ fontSize: 36, fontWeight: 900, color, fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.04em" }}>{formatTimer(elapsed)}</div>
    </div>
  );
}

function TabBar({ activeTab, onTabChange }) {
  const tabs = [{ id: "today", label: "Today" }, { id: "weights", label: "Weights" }, { id: "cardio", label: "Cardio" }, { id: "history", label: "History" }, { id: "exercises", label: "Library" }];
  return (
    <div style={{ display: "flex", gap: 2, padding: "6px", background: "rgba(255,255,255,0.03)", borderRadius: 16, border: "1px solid rgba(255,255,255,0.06)", marginBottom: 24 }}>
      {tabs.map(t => (
        <button key={t.id} onClick={() => onTabChange(t.id)} style={{ flex: 1, padding: "10px 4px", border: "none", borderRadius: 12, cursor: "pointer", fontSize: 13, fontWeight: 600, fontFamily: "'DM Sans', sans-serif", letterSpacing: "0.01em", background: activeTab === t.id ? "rgba(232,93,58,0.15)" : "transparent", color: activeTab === t.id ? "#E85D3A" : "rgba(255,255,255,0.4)", transition: "all 0.2s" }}>
          {t.label}
        </button>
      ))}

  );
}

function WorkoutTypeSelector({ selected, onSelect, suggestedType }) {
  const types = [{ id: "push", ...EXERCISE_DB.push }, { id: "pull", ...EXERCISE_DB.pull }, { id: "legs", ...EXERCISE_DB.legs }];
  return (
    <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
      {types.map(t => (
        <button key={t.id} onClick={() => onSelect(t.id)} style={{ flex: 1, padding: "16px 8px", border: "2px solid", borderColor: selected === t.id ? t.color : "rgba(255,255,255,0.08)", borderRadius: 14, cursor: "pointer", background: selected === t.id ? `${t.color}15` : "rgba(255,255,255,0.02)", transition: "all 0.25s", position: "relative" }}>
          <div style={{ fontSize: 18, fontWeight: 800, color: selected === t.id ? t.color : "rgba(255,255,255,0.5)", fontFamily: "'DM Sans', sans-serif" }}>{t.label}</div>
          <div style={{ fontSize: 10, color: "rgba(255,255,255,0.3)", marginTop: 4, fontFamily: "'DM Sans', sans-serif" }}>{t.muscles}</div>

          <button onClick={() => onRemoveSet(i)} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.2)", cursor: "pointer", fontSize: 18, padding: "4px 8px" }}>×</button>
        </div>
      ))}

    </div>
  );
}

              <button key={i} onClick={() => { onSelect(ex); onClose(); }} style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "10px 12px", border: "none", borderRadius: 10, cursor: "pointer", background: "rgba(255,255,255,0.02)", color: "#fff", marginBottom: 4, textAlign: "left" }}>

                <div style={{ flex: 1, minWidth: 0 }}>

}

function TodayView({ data, getSuggestedType }) {
  const today = getToday();
  const todayWorkouts = data.workouts.filter(w => w.date === today);
  const todayCardio = data.cardioSessions.filter(c => c.date === today);
  const suggested = getSuggestedType();
  const week = getWeekBounds();
  const weekWorkouts = data.workouts.filter(w => w.date >= week.start && w.date <= week.end);
  const weekCardio = data.cardioSessions.filter(c => c.date >= week.start && c.date <= week.end);
  const liftDays = new Set(weekWorkouts.map(w => w.date)).size;
  const cardioDays = new Set(weekCardio.map(c => c.date)).size;
  const totalSets = weekWorkouts.reduce((acc, w) => acc + w.exercises.reduce((a, e) => a + e.sets.length, 0), 0);
  const totalCardioMin = weekCardio.reduce((acc, c) => acc + (c.duration || 0), 0);
  let streak = 0; let checkDate = new Date();
  while (true) {
    const ds = checkDate.toISOString().split("T")[0];
    if (data.workouts.some(w => w.date === ds) || data.cardioSessions.some(c => c.date === ds)) { streak++; checkDate.setDate(checkDate.getDate() - 1); } else break;
  }
  return (
    <div>
      <div style={{ marginBottom: 24 }}>
        <h2 style={{ margin: 0, fontSize: 28, fontWeight: 900, color: "#fff", fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.02em" }}>{formatDate(today)}</h2>
        <p style={{ margin: "4px 0 0", fontSize: 13, color: "rgba(255,255,255,0.4)", fontFamily: "'DM Sans', sans-serif" }}>{streak > 0 ? `🔥 ${streak}-day streak` : "Start your streak today"}</p>
      </div>
      <div style={{ display: "flex", justifyContent: "center", gap: 32, marginBottom: 28, padding: "20px 0", background: "rgba(255,255,255,0.02)", borderRadius: 16, border: "1px solid rgba(255,255,255,0.06)" }}>
        <GoalRing current={liftDays} target={GOALS.liftsPerWeek} label="Lifts / Week" color="#E85D3A" size={90} />
        <GoalRing current={cardioDays} target={GOALS.cardioPerWeek} label="Cardio / Week" color="#E8A83A" size={90} />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 24 }}>
        {[{ label: "Total Sessions", value: weekWorkouts.length + weekCardio.length, sub: "this week" }, { label: "Sets Done", value: totalSets, sub: "weight training" }, { label: "Cardio Time", value: formatDuration(totalCardioMin), sub: "total" }].map((s, i) => (
          <div key={i} style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 14, padding: "14px 12px", textAlign: "center" }}>
            <div style={{ fontSize: 22, fontWeight: 900, color: "#fff", fontFamily: "'Bebas Neue', sans-serif" }}>{s.value}</div>
            <div style={{ fontSize: 10, color: "rgba(255,255,255,0.35)", textTransform: "uppercase", letterSpacing: "0.06em", fontFamily: "'DM Sans', sans-serif" }}>{s.label}</div>
            <div style={{ fontSize: 10, color: "rgba(255,255,255,0.2)", fontFamily: "'DM Sans', sans-serif" }}>{s.sub}</div>
          </div>
        ))}
      </div>
      <div style={{ background: `linear-gradient(135deg, ${EXERCISE_DB[suggested]?.color}15, transparent)`, border: `1px solid ${EXERCISE_DB[suggested]?.color}30`, borderRadius: 16, padding: 20, marginBottom: 24 }}>
        <div style={{ fontSize: 11, color: "rgba(255,255,255,0.4)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6, fontFamily: "'DM Sans', sans-serif", fontWeight: 700 }}>Suggested Next</div>
        <div style={{ fontSize: 22, fontWeight: 900, color: EXERCISE_DB[suggested]?.color, fontFamily: "'Bebas Neue', sans-serif" }}>{EXERCISE_DB[suggested]?.label} Day</div>
        <div style={{ fontSize: 12, color: "rgba(255,255,255,0.4)", fontFamily: "'DM Sans', sans-serif" }}>{EXERCISE_DB[suggested]?.muscles}</div>
      </div>
      <div style={{ marginBottom: 12 }}>
        <h3 style={{ fontSize: 14, fontWeight: 700, color: "rgba(255,255,255,0.5)", textTransform: "uppercase", letterSpacing: "0.06em", margin: "0 0 12px", fontFamily: "'DM Sans', sans-serif" }}>Today's Activity</h3>
        {todayWorkouts.length === 0 && todayCardio.length === 0 ? (
          <div style={{ padding: 32, textAlign: "center", color: "rgba(255,255,255,0.25)", border: "1px dashed rgba(255,255,255,0.08)", borderRadius: 14, fontFamily: "'DM Sans', sans-serif", fontSize: 13 }}>No workouts logged yet today. Hit the Weights or Cardio tab to get started.</div>
        ) : (
          <>
            {todayWorkouts.map((w, i) => (
              <div key={i} style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 12, padding: 14, marginBottom: 8, borderLeft: `3px solid ${EXERCISE_DB[w.type]?.color}` }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span style={{ fontSize: 14, fontWeight: 700, color: EXERCISE_DB[w.type]?.color, fontFamily: "'DM Sans', sans-serif" }}>{EXERCISE_DB[w.type]?.label}</span>
                  <span style={{ fontSize: 12, color: "rgba(255,255,255,0.3)", fontFamily: "'DM Sans', sans-serif" }}>{w.exercises.length} exercises · {w.exercises.reduce((a, e) => a + e.sets.length, 0)} sets</span>
                </div>
              </div>
            ))}
            {todayCardio.map((c, i) => { const ct = CARDIO_TYPES.find(t => t.id === c.type); return (
              <div key={i} style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 12, padding: 14, marginBottom: 8, borderLeft: `3px solid ${ct?.color}` }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span style={{ fontSize: 14, fontWeight: 700, color: ct?.color, fontFamily: "'DM Sans', sans-serif" }}>{ct?.icon} {ct?.label}</span>
                  <span style={{ fontSize: 12, color: "rgba(255,255,255,0.3)", fontFamily: "'DM Sans', sans-serif" }}>{c.distance ? `${c.distance} mi · ` : ""}{formatDuration(c.duration)}</span>
                </div>
              </div>
            ); })}
          </>
        )}
      </div>
    </div>
  );
}

function WeightsView({ data, setData, getSuggestedType }) {
  const [workoutType, setWorkoutType] = useState(null);
  const [exercises, setExercises] = useState([]);
  const [showPicker, setShowPicker] = useState(false);
  const [saved, setSaved] = useState(false);
  const [workoutStatus, setWorkoutStatus] = useState("idle");
  const [startTime, setStartTime] = useState(null);
  const [completedSetsMap, setCompletedSetsMap] = useState({});
  const [templates, setTemplates] = useState({ push: [], pull: [], legs: [] });
  const [showTemplates, setShowTemplates] = useState(false);
  const [templateName, setTemplateName] = useState("");
  const [showSaveTemplate, setShowSaveTemplate] = useState(false);
  const suggested = getSuggestedType();
  useEffect(() => { if (!workoutType) setWorkoutType(suggested); }, [suggested]);
  useEffect(() => { loadTemplates().then(t => setTemplates(t)); }, []);

  const addExercise = (ex) => { setExercises([...exercises, { ...ex, sets: [{ weight: 0, reps: 0 }] }]); setSaved(false); };
  const loadTemplate = (template) => { setExercises(template.exercises.map(ex => ({ ...ex, sets: ex.sets.map(s => ({ weight: s.weight || 0, reps: s.reps || 0 })) }))); setShowTemplates(false); setSaved(false); setCompletedSetsMap({}); };
  const saveTemplate = async () => { if (!templateName.trim() || exercises.length === 0) return; const template = { id: Date.now(), name: templateName.trim(), exercises: exercises.map(e => ({ name: e.name, equipment: e.equipment, primary: e.primary, sets: e.sets.map(s => ({ weight: s.weight || 0, reps: s.reps || 0 })) })) }; const updated = { ...templates, [workoutType]: [...(templates[workoutType] || []), template] }; setTemplates(updated); await saveTemplates(updated); setShowSaveTemplate(false); setTemplateName(""); };
  const deleteTemplate = async (templateId) => { const updated = { ...templates, [workoutType]: (templates[workoutType] || []).filter(t => t.id !== templateId) }; setTemplates(updated); await saveTemplates(updated); };
  const addSet = (exIndex) => { const updated = [...exercises]; const lastSet = updated[exIndex].sets[updated[exIndex].sets.length - 1]; updated[exIndex].sets.push({ weight: lastSet?.weight || 0, reps: lastSet?.reps || 0 }); setExercises(updated); setSaved(false); };
  const updateSet = (exIndex, setIndex, newSet) => { const updated = [...exercises]; updated[exIndex].sets[setIndex] = newSet; setExercises(updated); setSaved(false); };
  const removeSet = (exIndex, setIndex) => { const updated = [...exercises]; updated[exIndex].sets.splice(setIndex, 1); setExercises(updated); setSaved(false); };
  const removeExercise = (index) => { setExercises(exercises.filter((_, i) => i !== index)); const newMap = {}; Object.entries(completedSetsMap).forEach(([k, v]) => { const ki = Number(k); if (ki < index) newMap[ki] = v; else if (ki > index) newMap[ki - 1] = v; }); setCompletedSetsMap(newMap); setSaved(false); };
  const handleStart = () => { setWorkoutStatus("active"); setStartTime(Date.now()); setCompletedSetsMap({}); };
  const handleSetComplete = () => { for (let i = 0; i < exercises.length; i++) { const completed = completedSetsMap[i] || 0; if (completed < exercises[i].sets.length) { setCompletedSetsMap({ ...completedSetsMap, [i]: completed + 1 }); return; } } };
  const handleFinish = async () => { if (exercises.length === 0) return; const duration = startTime ? Math.floor((Date.now() - startTime) / 1000) : 0; const workout = { id: Date.now(), date: getToday(), type: workoutType, duration, exercises: exercises.map(e => ({ name: e.name, equipment: e.equipment, primary: e.primary, sets: e.sets.filter(s => s.reps > 0) })) }; const newData = { ...data, workouts: [...data.workouts, workout] }; setData(newData); await saveToStorage(newData); setSaved(true); setWorkoutStatus("idle"); setStartTime(null); setCompletedSetsMap({}); setTimeout(() => { setExercises([]); setSaved(false); }, 1500); };

  const typeColor = EXERCISE_DB[workoutType]?.color || "#E85D3A";
  const totalSets = exercises.reduce((a, e) => a + e.sets.length, 0);
  const totalCompleted = Object.values(completedSetsMap).reduce((a, b) => a + b, 0);

  return (
    <div>
      <h2 style={{ margin: "0 0 16px", fontSize: 24, fontWeight: 900, color: "#fff", fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.02em" }}>Weight Training</h2>
      <WorkoutTypeSelector selected={workoutType} onSelect={(t) => workoutStatus === "idle" && setWorkoutType(t)} suggestedType={suggested} />
      {workoutStatus === "idle" && workoutType && (
        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          <button onClick={() => setShowTemplates(true)} style={{ flex: 1, padding: "10px 14px", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, background: "rgba(255,255,255,0.03)", color: "rgba(255,255,255,0.6)", cursor: "pointer", fontSize: 12, fontWeight: 700, fontFamily: "'DM Sans', sans-serif" }}>📋 Load Template {(templates[workoutType]?.length || 0) > 0 ? `(${templates[workoutType].length})` : ""}</button>
          {exercises.length > 0 && <button onClick={() => setShowSaveTemplate(true)} style={{ flex: 1, padding: "10px 14px", border: `1px solid ${typeColor}40`, borderRadius: 10, background: `${typeColor}10`, color: typeColor, cursor: "pointer", fontSize: 12, fontWeight: 700, fontFamily: "'DM Sans', sans-serif" }}>💾 Save as Template</button>}
        </div>
      )}

      {showTemplates && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 16 }} onClick={e => { if (e.target === e.currentTarget) setShowTemplates(false); }}>
          <div style={{ background: "#1a1a1e", borderRadius: 20, width: "100%", maxWidth: 420, maxHeight: "70vh", overflow: "auto", padding: 24, border: "1px solid rgba(255,255,255,0.08)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <h3 style={{ margin: 0, fontSize: 18, fontWeight: 800, color: typeColor, fontFamily: "'DM Sans', sans-serif" }}>{EXERCISE_DB[workoutType]?.label} Templates</h3>
              <button onClick={() => setShowTemplates(false)} style={{ background: "rgba(255,255,255,0.06)", border: "none", color: "#fff", cursor: "pointer", fontSize: 18, width: 36, height: 36, borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center" }}>×</button>
            </div>
            {(templates[workoutType]?.length || 0) === 0 ? (
              <div style={{ padding: 32, textAlign: "center", color: "rgba(255,255,255,0.25)", fontFamily: "'DM Sans', sans-serif", fontSize: 13 }}>No templates saved yet. Build a workout and tap "Save as Template" to create one.</div>
            ) : templates[workoutType].map(t => (
              <div key={t.id} style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 14, padding: 16, marginBottom: 10, borderLeft: `3px solid ${typeColor}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>

                </div>
                <div style={{ marginBottom: 10 }}>
                  {t.exercises.map((ex, j) => (
                    <div key={j} style={{ display: "flex", gap: 8, alignItems: "center", padding: "4px 0" }}>

                      <span style={{ fontSize: 12, color: "rgba(255,255,255,0.5)", fontFamily: "'DM Sans', sans-serif" }}>{ex.name} <span style={{ color: "rgba(255,255,255,0.25)" }}>({ex.sets.length} sets{ex.sets[0]?.weight ? ` · ${ex.sets[0].weight}lb` : ""})</span></span>

              </div>
            ))}
          </div>
        </div>
      )}

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 12 }}>
          <button onClick={handleSetComplete} style={{ width: "100%", padding: "22px", border: "none", borderRadius: 16, cursor: "pointer", fontSize: 20, fontWeight: 900, fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.06em", background: "linear-gradient(135deg, #eab308, #ca8a04)", color: "#fff", boxShadow: "0 4px 24px rgba(234,179,8,0.3)" }}>✓ SET COMPLETE</button>
          <button onClick={handleFinish} style={{ width: "100%", padding: "22px", border: "none", borderRadius: 16, cursor: "pointer", fontSize: 20, fontWeight: 900, fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.06em", background: "linear-gradient(135deg, #ef4444, #dc2626)", color: "#fff", boxShadow: "0 4px 24px rgba(239,68,68,0.3)" }}>■ FINISH WORKOUT</button>
        </div>
      )}

      {saved && <div style={{ width: "100%", padding: "22px", borderRadius: 16, textAlign: "center", fontSize: 20, fontWeight: 900, fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.06em", background: "linear-gradient(135deg, #22c55e, #16a34a)", color: "#fff" }}>✓ WORKOUT SAVED!</div>}

      {showPicker && workoutType && <ExercisePicker type={workoutType} onSelect={addExercise} onClose={() => setShowPicker(false)} />}
    </div>
  );
}

function CardioView({ data, setData }) {
  const [cardioType, setCardioType] = useState("cycling");
  const [duration, setDuration] = useState("");
  const [distance, setDistance] = useState("");
  const [notes, setNotes] = useState("");
  const [saved, setSaved] = useState(false);
  const ct = CARDIO_TYPES.find(t => t.id === cardioType);

  const saveSession = async () => {
    if (!duration) return;
    const session = { id: Date.now(), date: getToday(), type: cardioType, duration: Number(duration), distance: distance ? Number(distance) : null, notes, pace: distance && duration ? (Number(duration) / Number(distance)).toFixed(2) : null };
    const newData = { ...data, cardioSessions: [...data.cardioSessions, session] };
    setData(newData); await saveToStorage(newData);
    setSaved(true); setTimeout(() => { setDuration(""); setDistance(""); setNotes(""); setSaved(false); }, 1500);
  };

  return (
    <div>
      <h2 style={{ margin: "0 0 16px", fontSize: 24, fontWeight: 900, color: "#fff", fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.02em" }}>Cardio Session</h2>
      <div style={{ display: "flex", gap: 10, marginBottom: 24 }}>
        {CARDIO_TYPES.map(t => (
          <button key={t.id} onClick={() => setCardioType(t.id)} style={{ flex: 1, padding: "18px 8px", border: "2px solid", borderColor: cardioType === t.id ? t.color : "rgba(255,255,255,0.08)", borderRadius: 14, cursor: "pointer", background: cardioType === t.id ? `${t.color}15` : "rgba(255,255,255,0.02)", transition: "all 0.25s" }}>
            <div style={{ fontSize: 28 }}>{t.icon}</div>
            <div style={{ fontSize: 14, fontWeight: 700, color: cardioType === t.id ? t.color : "rgba(255,255,255,0.5)", marginTop: 6, fontFamily: "'DM Sans', sans-serif" }}>{t.label}</div>
          </button>
        ))}
      </div>
      <div style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 16, padding: 20, marginBottom: 16 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
          <div>
            <label style={{ fontSize: 11, color: "rgba(255,255,255,0.4)", textTransform: "uppercase", letterSpacing: "0.08em", fontFamily: "'DM Sans', sans-serif", fontWeight: 700, display: "block", marginBottom: 6 }}>Duration (min)</label>
            <input type="number" value={duration} onChange={e => setDuration(e.target.value)} placeholder="0" style={{ width: "100%", padding: "12px 14px", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, background: "rgba(255,255,255,0.04)", color: "#fff", fontSize: 20, fontWeight: 700, fontFamily: "'DM Sans', sans-serif", outline: "none", boxSizing: "border-box" }} />
          </div>
          <div>
            <label style={{ fontSize: 11, color: "rgba(255,255,255,0.4)", textTransform: "uppercase", letterSpacing: "0.08em", fontFamily: "'DM Sans', sans-serif", fontWeight: 700, display: "block", marginBottom: 6 }}>Distance (mi)</label>
            <input type="number" step="0.1" value={distance} onChange={e => setDistance(e.target.value)} placeholder="0.0" style={{ width: "100%", padding: "12px 14px", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, background: "rgba(255,255,255,0.04)", color: "#fff", fontSize: 20, fontWeight: 700, fontFamily: "'DM Sans', sans-serif", outline: "none", boxSizing: "border-box" }} />
          </div>
        </div>
        {distance && duration && (
          <div style={{ padding: "10px 14px", background: `${ct?.color}10`, borderRadius: 10, marginBottom: 16, textAlign: "center" }}>
            <span style={{ fontSize: 12, color: "rgba(255,255,255,0.4)", fontFamily: "'DM Sans', sans-serif" }}>Pace: </span>
            <span style={{ fontSize: 16, fontWeight: 800, color: ct?.color, fontFamily: "'DM Sans', sans-serif" }}>{(Number(duration) / Number(distance)).toFixed(1)} min/mi</span>
          </div>
        )}
        <div>
          <label style={{ fontSize: 11, color: "rgba(255,255,255,0.4)", textTransform: "uppercase", letterSpacing: "0.08em", fontFamily: "'DM Sans', sans-serif", fontWeight: 700, display: "block", marginBottom: 6 }}>Notes</label>
          <input type="text" value={notes} onChange={e => setNotes(e.target.value)} placeholder="How did it feel?" style={{ width: "100%", padding: "10px 14px", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, background: "rgba(255,255,255,0.04)", color: "#fff", fontSize: 13, fontFamily: "'DM Sans', sans-serif", outline: "none", boxSizing: "border-box" }} />
        </div>
      </div>
      <button onClick={saveSession} disabled={!duration} style={{ width: "100%", padding: "16px", border: "none", borderRadius: 14, cursor: duration ? "pointer" : "default", fontSize: 15, fontWeight: 800, fontFamily: "'DM Sans', sans-serif", transition: "all 0.3s", background: saved ? "#3AE89F" : (duration ? ct?.color : "rgba(255,255,255,0.1)"), color: saved ? "#111" : (duration ? "#fff" : "rgba(255,255,255,0.3)"), opacity: duration ? 1 : 0.5 }}>
        {saved ? "✓ Session Saved!" : "Save Session"}
      </button>
    </div>
  );
}

function HistoryView({ data, setData }) {
  const [filter, setFilter] = useState("all");
  const allEntries = [...data.workouts.map(w => ({ ...w, category: "weights" })), ...data.cardioSessions.map(c => ({ ...c, category: "cardio" }))].sort((a, b) => (b.date > a.date ? 1 : -1));
  const filtered = filter === "all" ? allEntries : filter === "weights" ? allEntries.filter(e => e.category === "weights") : allEntries.filter(e => e.category === "cardio");
  const deleteEntry = async (entry) => {
    let newData;
    if (entry.category === "weights") { newData = { ...data, workouts: data.workouts.filter(w => w.id !== entry.id) }; }
    else { newData = { ...data, cardioSessions: data.cardioSessions.filter(c => c.id !== entry.id) }; }
    setData(newData); await saveToStorage(newData);
  };
  return (
    <div>
      <h2 style={{ margin: "0 0 16px", fontSize: 24, fontWeight: 900, color: "#fff", fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.02em" }}>History</h2>
      <div style={{ display: "flex", gap: 6, marginBottom: 20 }}>
        {["all", "weights", "cardio"].map(f => (
          <button key={f} onClick={() => setFilter(f)} style={{ padding: "8px 16px", border: "none", borderRadius: 10, cursor: "pointer", fontSize: 12, fontWeight: 700, fontFamily: "'DM Sans', sans-serif", textTransform: "capitalize", background: filter === f ? "rgba(232,93,58,0.15)" : "rgba(255,255,255,0.04)", color: filter === f ? "#E85D3A" : "rgba(255,255,255,0.4)" }}>{f}</button>
        ))}
      </div>
      {filtered.length === 0 ? (
        <div style={{ padding: 40, textAlign: "center", color: "rgba(255,255,255,0.25)", border: "1px dashed rgba(255,255,255,0.08)", borderRadius: 14, fontFamily: "'DM Sans', sans-serif", fontSize: 13 }}>No workouts logged yet.</div>
      ) : filtered.map((entry, i) => {
        if (entry.category === "weights") {
          const typeColor = EXERCISE_DB[entry.type]?.color;
          return (
            <div key={i} style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 14, padding: 16, marginBottom: 10, borderLeft: `3px solid ${typeColor}` }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div>
                  <div style={{ fontSize: 11, color: "rgba(255,255,255,0.3)", fontFamily: "'DM Sans', sans-serif" }}>{formatDate(entry.date)}</div>
                  <div style={{ fontSize: 16, fontWeight: 800, color: typeColor, fontFamily: "'DM Sans', sans-serif", marginTop: 4 }}>{EXERCISE_DB[entry.type]?.label}</div>
                </div>
                <button onClick={() => deleteEntry(entry)} style={{ background: "rgba(255,60,60,0.08)", border: "none", color: "rgba(255,60,60,0.5)", cursor: "pointer", fontSize: 11, padding: "4px 10px", borderRadius: 8, fontFamily: "'DM Sans', sans-serif", fontWeight: 600 }}>Delete</button>
              </div>
              <div style={{ marginTop: 10 }}>
                {entry.exercises.map((ex, j) => (
                  <div key={j} style={{ padding: "6px 0", borderBottom: j < entry.exercises.length - 1 ? "1px solid rgba(255,255,255,0.04)" : "none" }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: "rgba(255,255,255,0.7)", fontFamily: "'DM Sans', sans-serif" }}>{EQUIPMENT_ICONS[ex.equipment]} {ex.name}</div>
                    <div style={{ fontSize: 11, color: "rgba(255,255,255,0.3)", marginTop: 2, fontFamily: "'DM Sans', sans-serif" }}>{ex.sets.map((s) => `${s.weight}lb × ${s.reps}`).join(" → ")}</div>
                  </div>
                ))}
              </div>
            </div>
          );
        } else {
          const ct = CARDIO_TYPES.find(t => t.id === entry.type);
          return (
            <div key={i} style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 14, padding: 16, marginBottom: 10, borderLeft: `3px solid ${ct?.color}` }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div>
                  <div style={{ fontSize: 11, color: "rgba(255,255,255,0.3)", fontFamily: "'DM Sans', sans-serif" }}>{formatDate(entry.date)}</div>
                  <div style={{ fontSize: 16, fontWeight: 800, color: ct?.color, fontFamily: "'DM Sans', sans-serif", marginTop: 4 }}>{ct?.icon} {ct?.label}</div>
                </div>
                <button onClick={() => deleteEntry(entry)} style={{ background: "rgba(255,60,60,0.08)", border: "none", color: "rgba(255,60,60,0.5)", cursor: "pointer", fontSize: 11, padding: "4px 10px", borderRadius: 8, fontFamily: "'DM Sans', sans-serif", fontWeight: 600 }}>Delete</button>
              </div>
              <div style={{ display: "flex", gap: 16, marginTop: 10 }}>
                <div><div style={{ fontSize: 10, color: "rgba(255,255,255,0.3)", textTransform: "uppercase", fontFamily: "'DM Sans', sans-serif" }}>Duration</div><div style={{ fontSize: 15, fontWeight: 700, color: "#fff", fontFamily: "'DM Sans', sans-serif" }}>{formatDuration(entry.duration)}</div></div>
                {entry.distance && <div><div style={{ fontSize: 10, color: "rgba(255,255,255,0.3)", textTransform: "uppercase", fontFamily: "'DM Sans', sans-serif" }}>Distance</div><div style={{ fontSize: 15, fontWeight: 700, color: "#fff", fontFamily: "'DM Sans', sans-serif" }}>{entry.distance} mi</div></div>}
                {entry.pace && <div><div style={{ fontSize: 10, color: "rgba(255,255,255,0.3)", textTransform: "uppercase", fontFamily: "'DM Sans', sans-serif" }}>Pace</div><div style={{ fontSize: 15, fontWeight: 700, color: "#fff", fontFamily: "'DM Sans', sans-serif" }}>{entry.pace} min/mi</div></div>}
              </div>
              {entry.notes && <div style={{ marginTop: 8, fontSize: 12, color: "rgba(255,255,255,0.35)", fontStyle: "italic", fontFamily: "'DM Sans', sans-serif" }}>"{entry.notes}"</div>}
            </div>
          );
        }
      })}
    </div>
  );
}

function ExerciseLibrary() {
  const [activeGroup, setActiveGroup] = useState("push");
  const [equipFilter, setEquipFilter] = useState("all");
  const group = EXERCISE_DB[activeGroup];
  const exercises = equipFilter === "all" ? group.exercises : group.exercises.filter(e => e.equipment === equipFilter);
  const byMuscle = {};
  exercises.forEach(ex => { if (!byMuscle[ex.primary]) byMuscle[ex.primary] = []; byMuscle[ex.primary].push(ex); });
  return (
    <div>
      <h2 style={{ margin: "0 0 16px", fontSize: 24, fontWeight: 900, color: "#fff", fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.02em" }}>Exercise Library</h2>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        {Object.entries(EXERCISE_DB).map(([key, val]) => (
          <button key={key} onClick={() => setActiveGroup(key)} style={{ padding: "8px 16px", border: "2px solid", borderColor: activeGroup === key ? val.color : "rgba(255,255,255,0.08)", borderRadius: 10, cursor: "pointer", background: activeGroup === key ? `${val.color}15` : "transparent", color: activeGroup === key ? val.color : "rgba(255,255,255,0.4)", fontSize: 13, fontWeight: 700, fontFamily: "'DM Sans', sans-serif" }}>{val.label}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: 20 }}>
        {["all", "barbell", "dumbbells", "bodyweight", "cable"].map(f => (
          <button key={f} onClick={() => setEquipFilter(f)} style={{ padding: "6px 12px", border: "none", borderRadius: 8, cursor: "pointer", fontSize: 11, fontWeight: 600, fontFamily: "'DM Sans', sans-serif", textTransform: "capitalize", background: equipFilter === f ? `${group.color}20` : "rgba(255,255,255,0.04)", color: equipFilter === f ? group.color : "rgba(255,255,255,0.4)" }}>{f === "all" ? "All" : `${EQUIPMENT_ICONS[f]} ${f}`}</button>
        ))}
      </div>
      {Object.entries(byMuscle).map(([muscle, exs]) => (
        <div key={muscle} style={{ marginBottom: 20 }}>
          <h4 style={{ fontSize: 12, fontWeight: 700, color: group.color, textTransform: "uppercase", letterSpacing: "0.08em", margin: "0 0 10px", fontFamily: "'DM Sans', sans-serif", borderBottom: `1px solid ${group.color}20`, paddingBottom: 6 }}>{muscle}</h4>
          {exs.map((ex, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 12px", background: "rgba(255,255,255,0.02)", borderRadius: 10, marginBottom: 4, border: "1px solid rgba(255,255,255,0.04)" }}>
              <ExerciseIllustration name={ex.name} equipment={ex.equipment} size={42} color={group.color} />
              <div>
                <div style={{ fontSize: 14, fontWeight: 600, color: "rgba(255,255,255,0.8)", fontFamily: "'DM Sans', sans-serif" }}>{ex.name}</div>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,0.3)", fontFamily: "'DM Sans', sans-serif", textTransform: "capitalize" }}>{EQUIPMENT_ICONS[ex.equipment]} {ex.equipment}</div>
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

// ─── Main App ───────────────────────────────────────────────
function FitnessTracker() {
  const [tab, setTab] = useState("today");
  const [data, setData] = useState({ workouts: [], cardioSessions: [] });
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      const stored = await loadFromStorage();
      if (stored && (stored.workouts?.length || stored.cardioSessions?.length)) setData(stored);
      setLoaded(true);
    })();
  }, []);

  const getSuggestedType = useCallback(() => {
    const recent = [...data.workouts].sort((a, b) => (b.date > a.date ? 1 : -1));
    if (recent.length === 0) return "push";
    const lastType = recent[0].type;
    return { push: "pull", pull: "legs", legs: "push" }[lastType] || "push";
  }, [data.workouts]);

  if (!loaded) return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#111114", color: "#E85D3A", fontFamily: "'Bebas Neue', sans-serif", fontSize: 28 }}>Loading...</div>
  );

  return (
    <div style={{ minHeight: "100vh", minHeight: "100dvh", background: "linear-gradient(180deg, #111114 0%, #0d0d10 100%)", color: "#fff", fontFamily: "'DM Sans', sans-serif" }}>
      <div style={{ maxWidth: 520, margin: "0 auto", padding: "20px 16px 100px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 24 }}>
          <div style={{ width: 42, height: 42, borderRadius: 12, background: "linear-gradient(135deg, #E85D3A, #E8A83A)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, fontWeight: 900 }}>⚡</div>
          <div>
            <h1 style={{ margin: 0, fontSize: 22, fontWeight: 900, fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.04em", lineHeight: 1 }}>IRON PULSE</h1>
            <div style={{ fontSize: 10, color: "rgba(255,255,255,0.3)", letterSpacing: "0.12em", textTransform: "uppercase", fontWeight: 600 }}>Push · Pull · Legs · Cardio</div>
          </div>
        </div>
        <TabBar activeTab={tab} onTabChange={setTab} />
        {tab === "today" && <TodayView data={data} getSuggestedType={getSuggestedType} />}
        {tab === "weights" && <WeightsView data={data} setData={setData} getSuggestedType={getSuggestedType} />}
        {tab === "cardio" && <CardioView data={data} setData={setData} />}
        {tab === "history" && <HistoryView data={data} setData={setData} />}
        {tab === "exercises" && <ExerciseLibrary />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FitnessTracker />);
</script>
</body>
</html>
